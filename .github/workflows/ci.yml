# Needs no secrets: live PayPal/LLM tests are marked `live` and excluded by default.
name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: payops
          POSTGRES_PASSWORD: payops_local
          POSTGRES_DB: payops_test
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U payops" --health-interval 5s --health-timeout 5s --health-retries 12
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m venv .venv && .venv/bin/pip install -r requirements.txt pip-audit==2.9.0 && .venv/bin/pip install --no-deps -r requirements-toolkit.txt
      - run: .venv/bin/pytest
        env:
          DATABASE_URL: postgresql+psycopg://payops:payops_local@localhost:5433/payops_test
      - run: .venv/bin/pip-audit -r requirements.txt
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
