version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule: {interval: weekly}
    open-pull-requests-limit: 3
    cooldown: {default-days: 7} # skip versions newer than a week (supply-chain risk)
  - package-ecosystem: npm
    directory: /web
    schedule: {interval: weekly}
    open-pull-requests-limit: 3
    cooldown: {default-days: 7} # skip versions newer than a week (supply-chain risk)
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly}
    open-pull-requests-limit: 3
    cooldown: {default-days: 7} # skip versions newer than a week (supply-chain risk)
