services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: payops
      POSTGRES_PASSWORD: ${PAYOPS_DB_PASSWORD:-payops_local}
      POSTGRES_DB: payops
    ports: ["${PAYOPS_DB_PORT:-5433}:5432"]
    volumes: [payops-db:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payops"]
      interval: 3s
      retries: 20
volumes:
  payops-db:
